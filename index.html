<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tests Unicaja</title>

    <style>
        :root {
            --p: #0056b3;
            --ph: #004494;
            --bg: #f4f7f6;
            --t: #333;
            --cb: #d4edda;
            --cbo: #c3e6cb;
            --ct: #155724;
            --ib: #f8d7da;
            --ibo: #f5c6cb;
            --it: #721c24;
            --b: #ddd;
            --db: #e6f4ea;
            --dbo: #34a853;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--t);
            margin: 0;
            padding: 15px;
            line-height: 1.6;
        }

        .c {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,.05);
            min-height: 80vh;
        }

        h1 {
            text-align: center;
            font-size: 1.5rem;
            color: var(--p);
            margin-bottom: 20px;
        }

        h2 {
            font-size: 1.3rem;
            color: var(--p);
            margin-bottom: 15px;
            text-align: center;
        }

        .v { display: none; }
        .v.a { display: block; }

        .mg {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
        }

        .mc {
            background: #fff;
            border: 2px solid var(--b);
            border-radius: 10px;
            padding: 20px 10px;
            text-align: center;
            cursor: pointer;
            transition: all .2s;
            font-weight: 700;
            color: var(--p);
        }

        .mc:hover {
            border-color: var(--p);
            background: #f0f7ff;
        }

        .tl {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .ti {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border: 2px solid var(--b);
            border-radius: 8px;
            cursor: pointer;
            transition: all .2s;
            background: #fff;
        }

        .ti:hover { border-color: var(--p); }

        .ti.d {
            background: var(--db);
            border-color: var(--dbo);
        }

        .tn { font-weight: 600; }

        .ts {
            font-size: .85rem;
            color: #666;
            background: #eee;
            padding: 4px 8px;
            border-radius: 12px;
            white-space: nowrap;
        }

        .ti.d .ts {
            background: var(--dbo);
            color: #fff;
        }

        .bb {
            background: none;
            border: none;
            color: var(--p);
            font-size: 1rem;
            cursor: pointer;
            padding: 0;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: 700;
        }

        .bb:hover { text-decoration: underline; }

        .qc {
            background: #fff;
            border: 1px solid var(--b);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .qt {
            font-weight: 600;
            margin-bottom: 12px;
            font-size: 1.05rem;
        }

        .o {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .ol {
            display: flex;
            align-items: flex-start;
            padding: 10px;
            border: 1px solid var(--b);
            border-radius: 6px;
            cursor: pointer;
            transition: background .2s;
        }

        .ol:hover { background: #f9f9f9; }

        .ol input[type=radio] {
            margin-top: 5px;
            margin-right: 10px;
            cursor: pointer;
        }

        .ch {
            background: var(--cb) !important;
            border-color: var(--cbo) !important;
            color: var(--ct) !important;
            font-weight: 600;
        }

        .ic {
            background: var(--ib) !important;
            border-color: var(--ibo) !important;
            color: var(--it) !important;
            font-weight: 600;
        }

        .bc {
            text-align: center;
            margin-top: 20px;
            margin-bottom: 20px;
        }

        .btn {
            background: var(--p);
            color: #fff;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: 700;
            transition: background .3s;
        }

        .btn:hover { background: var(--ph); }

        .rp {
            display: none;
            background: #e2f0fb;
            border: 2px solid #b6d4fe;
            color: #084298;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .msg {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .error { color: #b00020; }

        @media(min-width: 600px) {
            .btn { width: auto; }
        }
    </style>
</head>

<body>
<div class="c">

    <h1>Tests Unicaja</h1>

    <!-- VISTA 0: MÓDULOS -->
    <div id="v0" class="v a">
        <h2>Selecciona un Módulo</h2>
        <div class="mg" id="m"></div>
    </div>

    <!-- VISTA 1: TESTS DEL MÓDULO -->
    <div id="v1" class="v">
        <button class="bb" onclick="go(0)">← Volver a Módulos</button>
        <h2 id="mt">Módulo 1</h2>
        <div id="loading" class="msg" style="display:none">Cargando módulo...</div>
        <div id="error" class="msg error" style="display:none"></div>
        <div class="tl" id="t"></div>
    </div>

    <!-- VISTA 2: PREGUNTAS -->
    <div id="v2" class="v">
        <button class="bb" onclick="go(1)">← Volver a la lista</button>
        <h2 id="tt">Test</h2>

        <div id="rp" class="rp"></div>
        <div id="qc"></div>

        <div class="bc">
            <button class="btn" id="sb" onclick="corr()">Corregir Test</button>

            <button class="btn"
                    id="rb"
                    onclick="start(cid)"
                    style="display:none;background:#6c757d;margin-top:10px">
                Volver a intentar
            </button>
        </div>
    </div>

</div>

<script>
    // CONFIGURACIÓN DE LOS MÓDULOS
    const M = [];

    for (let i = 1; i <= 10; i++) {
        M.push({
            i: i,
            n: "Módulo " + i,
            archivo: "datos_m" + i + ".js"
        });
    }

    // VARIABLES DE LA APLICACIÓN
    let datos = {};
    let cid = "";
    let cmid = 1;
    let currentScript = null;
    let loadToken = 0;

    const $ = id => document.getElementById(id);


    // CAMBIAR DE VISTA
    function go(v) {
        document.querySelectorAll('.v').forEach(e => e.classList.remove('a'));
        $('v' + v).classList.add('a');

        if (v === 0) renderM();
    }


    // MOSTRAR LOS 10 MÓDULOS
    function renderM() {
        $('m').innerHTML = M.map(m => `
            <div class="mc" onclick="loadModule(${m.i})">
                ${m.n}
            </div>
        `).join('');
    }


    // CARGAR EL ARCHIVO JS DEL MÓDULO SELECCIONADO
    function loadModule(id) {
        cmid = id;

        const modulo = M.find(m => m.i === id);

        $('mt').innerText = modulo.n;
        $('t').innerHTML = '';
        $('error').style.display = 'none';
        $('loading').style.display = 'block';

        go(1);

        // Evitar que una carga anterior sobrescriba la nueva
        const token = ++loadToken;

        // Eliminar el script anterior
        if (currentScript) {
            currentScript.remove();
            currentScript = null;
        }

        // Limpiar los datos anteriores
        datos = {};
        try { delete window.D; } catch (e) { window.D = undefined; }

        // Crear y cargar el script del módulo
        const script = document.createElement('script');
        script.src = modulo.archivo + '?v=' + Date.now(); // evita la caché

        currentScript = script;

        script.onload = function() {
            if (token !== loadToken) return;

            $('loading').style.display = 'none';

            // Acepta tanto window.D = {...} como const/let/var D = {...}
            let cargado = window.D;
            if (!cargado && typeof D !== 'undefined') cargado = D;

            if (!cargado || typeof cargado !== 'object') {
                mostrarError(
                    'El archivo ' + modulo.archivo +
                    ' se ha cargado, pero no contiene los datos esperados.' +
                    ' Abre la consola (F12) por si hay un error de sintaxis en el archivo.'
                );
                return;
            }

            datos = cargado;

            renderT();
        };

        script.onerror = function() {
            if (token !== loadToken) return;

            $('loading').style.display = 'none';

            mostrarError(
                'No se ha podido cargar ' + modulo.archivo +
                '. Comprueba que el archivo existe y que su nombre es correcto.'
            );
        };

        document.head.appendChild(script);
    }


    // MOSTRAR ERRORES
    function mostrarError(mensaje) {
        $('error').innerText = mensaje;
        $('error').style.display = 'block';
    }


    // FECHA DEL ÚLTIMO TEST REALIZADO
    function getDateStr(ts) {
        if (!ts) return "No hecho";

        let d = new Date(ts);
        let n = new Date();

        let diff = Math.floor((n - d) / (1000 * 60 * 60 * 24));

        if (diff === 0) return "Hecho hoy";
        if (diff === 1) return "Hecho ayer";

        return `Hace ${diff} días`;
    }


    // MOSTRAR LOS TESTS DEL MÓDULO CARGADO
    function renderT() {
        let tests = Object.keys(datos);

        if (tests.length === 0) {
            $('t').innerHTML = '<div class="msg">Este módulo todavía no tiene tests.</div>';
            return;
        }

        let hist = JSON.parse(localStorage.getItem('hist') || '{}');

        $('t').innerHTML = tests.map(t => {
            let done = hist[cmid + '_' + t] || hist[t];

            return `
                <div class="ti ${done ? 'd' : ''}" onclick="start('${t}')">
                    <span class="tn">${datos[t].n}</span>
                    <span class="ts">${getDateStr(done)}</span>
                </div>
            `;
        }).join('');
    }


    // INICIAR UN TEST
    const limpia = t => String(t).replace(/^\s*(\d+|[a-dA-D])\)\s*/, '');

    function start(id) {
        cid = id;

        $('tt').innerText = datos[id].n;

        $('rp').style.display = 'none';
        $('sb').style.display = 'inline-block';
        $('rb').style.display = 'none';

        $('qc').innerHTML = datos[id].q.map((q, i) => `
            <div class="qc" id="q${i}">
                <div class="qt">${i + 1}) ${limpia(q[0])}</div>

                <div class="o">
                    ${q[1].map((o, j) => `
                        <label class="ol">
                            <input type="radio" name="q${i}" value="${j}">
                            ${String.fromCharCode(97 + j)}) ${limpia(o)}
                        </label>
                    `).join('')}
                </div>
            </div>
        `).join('');

        go(2);
    }


    // CORREGIR EL TEST
    function corr() {
        let qs = datos[cid].q;
        let c = 0;

        let hist = JSON.parse(localStorage.getItem('hist') || '{}');

        // Guardar fecha de realización
        hist[cmid + '_' + cid] = Date.now();

        localStorage.setItem('hist', JSON.stringify(hist));

        qs.forEach((q, i) => {
            let sel = document.querySelector(`input[name="q${i}"]:checked`);
            let qDiv = $('q' + i);

            qDiv.querySelectorAll('.ol').forEach(l => {
                l.classList.remove('ch', 'ic');
            });

            if (sel) {
                let v = parseInt(sel.value);

                if (v === q[2]) {
                    c++;
                    sel.closest('.ol').classList.add('ch');
                } else {
                    sel.closest('.ol').classList.add('ic');

                    qDiv.querySelector(`input[value="${q[2]}"]`)
                        .closest('.ol')
                        .classList.add('ch');
                }

            } else {
                qDiv.querySelector(`input[value="${q[2]}"]`)
                    .closest('.ol')
                    .classList.add('ch');
            }
        });

        $('rp').style.display = 'block';
        $('rp').innerText = `Has acertado ${c} de ${qs.length} preguntas.`;

        $('sb').style.display = 'none';
        $('rb').style.display = 'inline-block';

        window.scrollTo(0, 0);
    }


    // INICIAR LA APLICACIÓN
    renderM();

</script>

</body>
</html>
